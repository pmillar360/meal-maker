name: CI

on:
  pull_request:
  push:
    branches: [master, prod]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.8.17"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run backend tests
        run: uv run pytest --tb=short --verbose

  backend-smoke:
    name: Backend smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: backend-tests
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.8.17"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Check app imports
        run: uv run python -c "import app.main; print(app.main.app.title)"
